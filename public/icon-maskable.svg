<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Smart Bible">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a6cf0"/>
      <stop offset="0.55" stop-color="#3a44a8"/>
      <stop offset="1" stop-color="#2e4a36"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8ff"/>
    </linearGradient>
  </defs>

  <!-- full-bleed background for maskable safe zone -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- book scaled into the ~80% safe area -->
  <g transform="translate(256 256) scale(0.66) translate(-256 -256)">
    <path d="M256 158 C 214 130, 150 126, 104 140 V 388 C 150 374, 214 378, 256 404 Z" fill="url(#page)"/>
    <path d="M256 158 C 298 130, 362 126, 408 140 V 388 C 362 374, 298 378, 256 404 Z" fill="url(#page)"/>
    <path d="M256 158 V 404" stroke="#aab6e6" stroke-width="7" stroke-linecap="round"/>
    <g stroke="#9aa6d8" stroke-width="10" stroke-linecap="round" opacity="0.85">
      <line x1="138" y1="206" x2="224" y2="216"/>
      <line x1="138" y1="244" x2="224" y2="254"/>
      <line x1="138" y1="282" x2="224" y2="292"/>
      <line x1="288" y1="216" x2="374" y2="206"/>
      <line x1="288" y1="254" x2="374" y2="244"/>
      <line x1="288" y1="292" x2="374" y2="282"/>
    </g>
    <g fill="#8ce0d6">
      <rect x="244" y="300" width="24" height="86" rx="9"/>
      <rect x="222" y="328" width="68" height="24" rx="9"/>
    </g>
  </g>
</svg>
